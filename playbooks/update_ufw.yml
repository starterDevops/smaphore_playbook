---
# =============================================================================
#  update_ufw.yml
#  Idempotent playbook to add UFW allow-rules on VOD / NayaTV servers.
#  Triggered by Semaphore (called from the UFW Self-Service Portal after approval).
#
#  Extra vars (all required, passed by Semaphore Survey / API):
#    target_group : "vod" | "nayatv_live" | "all"
#    subnets      : comma-separated CIDRs, e.g. "10.10.0.0/24,192.168.5.32/32"
#    ports        : comma-separated ports,  e.g. "80,443,8443"
#    protocol     : "tcp" | "udp"
#    request_id   : unique portal request id (also used as UFW comment tag)
#    comment      : human comment, e.g. "Customer ACME - ticket INC1234"
# =============================================================================

- name: "UFW rule update - request {{ request_id }}"
  hosts: "{{ target_group }}"
  become: true
  gather_facts: true

  # Fail fast if any required variable was not supplied
  pre_tasks:
    - name: Validate required variables were passed
      ansible.builtin.assert:
        that:
          - target_group   is defined and target_group   | length > 0
          - subnets        is defined and subnets        | length > 0
          - ports          is defined and ports          | length > 0
          - protocol       is defined and protocol in ["tcp","udp"]
          - request_id     is defined and request_id     | length > 0
          - comment        is defined and comment        | length > 0
        fail_msg: "Missing or invalid variables. Received: target_group={{ target_group | default('') }}, subnets={{ subnets | default('') }}, ports={{ ports | default('') }}, protocol={{ protocol | default('') }}, request_id={{ request_id | default('') }}"

    - name: Split subnets and ports into lists
      ansible.builtin.set_fact:
        subnet_list: "{{ subnets.split(',') | map('trim') | list }}"
        port_list:   "{{ ports.split(',')   | map('trim') | list }}"

    - name: Sanity check - CIDR format
      ansible.builtin.assert:
        that:
          - item | ansible.utils.ipaddr('net') is not none
        fail_msg: "Invalid CIDR: {{ item }}"
      loop: "{{ subnet_list }}"

    - name: Sanity check - port range 1-65535
      ansible.builtin.assert:
        that:
          - (item | int) >= 1
          - (item | int) <= 65535
        fail_msg: "Invalid port: {{ item }}"
      loop: "{{ port_list }}"

  tasks:
    - name: Ensure UFW package is installed
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Capture current UFW status BEFORE change
      ansible.builtin.command: ufw status numbered
      register: ufw_before
      changed_when: false

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: /var/backups
        state: directory
        mode: '0750'
        owner: root
        group: root

    - name: Write pre-change UFW backup
      ansible.builtin.copy:
        dest: "/var/backups/ufw_{{ ansible_date_time.iso8601_basic_short }}_{{ request_id }}.txt"
        content: |
          # UFW state BEFORE request {{ request_id }} at {{ ansible_date_time.iso8601 }}
          # Host: {{ inventory_hostname }}
          # Comment: {{ comment }}
          {{ ufw_before.stdout }}
        mode: '0640'
        owner: root
        group: root

    - name: Add UFW allow rules (subnet x port cross-product)
      community.general.ufw:
        rule: allow
        from_ip: "{{ item.0 }}"
        to_port: "{{ item.1 }}"
        proto: "{{ protocol }}"
        comment: "req:{{ request_id }} {{ comment | truncate(60, True, '') }}"
      loop: "{{ subnet_list | product(port_list) | list }}"
      register: ufw_result

    - name: Ensure UFW is enabled (does nothing if already enabled)
      community.general.ufw:
        state: enabled

    - name: Reload UFW only if rules changed
      ansible.builtin.command: ufw reload
      when: ufw_result.changed
      register: ufw_reload

    - name: Capture UFW status AFTER change
      ansible.builtin.command: ufw status numbered
      register: ufw_after
      changed_when: false

    - name: Show the resulting UFW state
      ansible.builtin.debug:
        msg: "{{ ufw_after.stdout_lines }}"

  post_tasks:
    - name: Summarize change for the portal
      ansible.builtin.debug:
        msg:
          request_id: "{{ request_id }}"
          host: "{{ inventory_hostname }}"
          changed: "{{ ufw_result.changed }}"
          subnets: "{{ subnet_list }}"
          ports: "{{ port_list }}"
          protocol: "{{ protocol }}"
          rules_after: "{{ ufw_after.stdout_lines }}"
