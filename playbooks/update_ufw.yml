---
# =============================================================================
#  update_ufw.yml
#  Idempotent playbook to add UFW allow-rules on VOD / NayaTV servers.
#  Triggered by Semaphore (called from the UFW Self-Service Portal after approval).
#
#  Extra vars (all required, passed by Semaphore Survey / API):
#    target_group : "vod" | "nayatv_live" | "all"
#    subnets      : comma-separated CIDRs, e.g. "10.10.0.0/24,192.168.5.32/32"
#    ports        : comma-separated ports,  e.g. "80,443,8443"
#    protocol     : "tcp" | "udp"
#    ticket_id    : unique portal / ticket id (also used as UFW comment tag)
#    comment      : human comment, e.g. "Customer ACME - ticket INC1234"
# =============================================================================

- name: "UFW rule update"
  hosts: "{{ target_group }}"
  become: true
  gather_facts: true

  vars:
    # Single definition of the backup path so the file that is written and the
    # path reported to the portal can never drift apart. Evaluated lazily, so
    # ticket_id being set in pre_tasks is fine; ansible_date_time is gathered
    # once per run and is therefore stable across both uses.
    _ufw_backup_file: "/var/backups/ufw_{{ ansible_date_time.iso8601_basic_short }}_{{ ticket_id }}.txt"

  # Fail fast if any required variable was not supplied
  pre_tasks:
    - name: Trim whitespace from all inputs
      ansible.builtin.set_fact:
        target_group: "{{ target_group | default('') | trim }}"
        subnets:      "{{ subnets      | default('') | trim }}"
        ports:        "{{ ports        | default('') | trim }}"
        protocol:     "{{ protocol     | default('') | trim | lower }}"
        comment:      "{{ comment      | default('') | trim }}"
        ticket_id:    "{{ ticket_id    | default('') | trim }}"

    - name: Default ticket_id if not provided
      ansible.builtin.set_fact:
        ticket_id: "manual-{{ ansible_date_time.iso8601_basic_short }}"
      when: ticket_id | length == 0

    - name: Show the effective ticket_id
      ansible.builtin.debug:
        msg: "Using ticket_id: {{ ticket_id }}"

    - name: Validate required variables were passed
      ansible.builtin.assert:
        that:
          - target_group   is defined and target_group   | length > 0
          - subnets        is defined and subnets        | length > 0
          - ports          is defined and ports          | length > 0
          - protocol       is defined and protocol in ["tcp","udp"]
          - comment        is defined and comment        | length > 0
        fail_msg: "Missing or invalid variables. Received: target_group='{{ target_group | default('') }}', subnets='{{ subnets | default('') }}', ports='{{ ports | default('') }}', protocol='{{ protocol | default('') }}', comment='{{ comment | default('') }}'"

    - name: Split subnets and ports into lists
      ansible.builtin.set_fact:
        subnet_list: "{{ subnets.split(',') | map('trim') | list }}"
        port_list:   "{{ ports.split(',')   | map('trim') | list }}"

    # iptables' multiport match accepts at most 15 port specifications in one
    # rule, and UFW builds on it. Beyond that ufw fails with an error that does
    # not mention the limit, so catch it here with an explanation instead.
    #
    # If you genuinely need more than 15, split them across two requests - or
    # use a port range, which counts as one spec.
    - name: Refuse more than 15 ports in a single rule
      ansible.builtin.assert:
        that:
          - port_list | length <= 15
        fail_msg: >-
          {{ port_list | length }} ports were requested, but a single firewall
          rule can cover at most 15 (an iptables multiport limit that UFW
          inherits). Split this into more than one request, or use a port range
          such as 8000:8010, which counts as one.

    - name: Show effective inputs
      ansible.builtin.debug:
        msg:
          ticket_id: "{{ ticket_id }}"
          subnet_list: "{{ subnet_list }}"
          port_list: "{{ port_list }}"
          protocol: "{{ protocol }}"
          target_group: "{{ target_group }}"

  tasks:
    - name: Ensure UFW package is installed
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Capture current UFW status BEFORE change
      ansible.builtin.command: ufw status numbered
      register: ufw_before
      changed_when: false

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: /var/backups
        state: directory
        mode: '0750'
        owner: root
        group: root

    - name: Write pre-change UFW backup
      ansible.builtin.copy:
        dest: "{{ _ufw_backup_file }}"
        content: |
          # UFW state BEFORE ticket {{ ticket_id }} at {{ ansible_date_time.iso8601 }}
          # Host: {{ inventory_hostname }}
          # Comment: {{ comment }}
          {{ ufw_before.stdout }}
        mode: '0640'
        owner: root
        group: root

    # ---------------------------------------------------------------------- #
    #  One rule per subnet, covering every requested port.
    #
    #  Previously this looped over the CROSS-PRODUCT of subnets and ports, so
    #  one address and four ports produced four separate rules:
    #
    #      3030/tcp   ALLOW   fd00::/32
    #      554/tcp    ALLOW   fd00::/32
    #      1935/tcp   ALLOW   fd00::/32
    #      8080/tcp   ALLOW   fd00::/32
    #
    #  UFW accepts a comma-separated port list, producing one rule instead:
    #
    #      554,1935,3030,8080/tcp   ALLOW   fd00::/32
    #
    #  This matches how the rest of the firewall is already managed by hand
    #  (the "Customer Pools TCP" rules), keeps `ufw status` readable, and means
    #  fewer iptables rules to traverse per packet.
    #
    #  The trade-off, stated plainly: removing ONE port later means deleting
    #  the whole rule and re-adding it without that port. With a rule per port
    #  you could delete just the one. Grouped rules are easier to read and
    #  slightly harder to amend.
    # ---------------------------------------------------------------------- #
    - name: Add UFW allow rules (one rule per subnet, all ports together)
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
        to_port: "{{ port_list | join(',') }}"
        proto: "{{ protocol }}"
        comment: "ticket:{{ ticket_id }} {{ comment | truncate(60, True, '') }}"
      loop: "{{ subnet_list }}"
      register: ufw_result

    - name: Ensure UFW is enabled (does nothing if already enabled)
      community.general.ufw:
        state: enabled

    - name: Reload UFW only if rules changed
      ansible.builtin.command: ufw reload
      when: ufw_result.changed
      register: ufw_reload

    - name: Capture UFW status AFTER change
      ansible.builtin.command: ufw status numbered
      register: ufw_after
      changed_when: false

    - name: Show the resulting UFW state
      ansible.builtin.debug:
        msg: "{{ ufw_after.stdout_lines }}"

  post_tasks:
    - name: Summarize change for the portal
      ansible.builtin.debug:
        msg:
          ticket_id: "{{ ticket_id }}"
          host: "{{ inventory_hostname }}"
          changed: "{{ ufw_result.changed }}"
          subnets: "{{ subnet_list }}"
          ports: "{{ port_list }}"
          protocol: "{{ protocol }}"
          rules_after: "{{ ufw_after.stdout_lines }}"

    # ---------------------------------------------------------------------- #
    #  Structured result for the portal.  See RESULT_CONTRACT.md.
    #
    #  The debug above is for a human reading the Semaphore log. This block is
    #  the machine contract: one JSON object per host, which the portal turns
    #  into "livestream5: 3 firewall rules added" rather than making a
    #  non-technical requester read Ansible output.
    #
    #  This playbook has NO meta:end_host, so post_tasks always run and a
    #  single emission here covers every path. Playbooks that DO exit early
    #  must emit before each end_host - see rule 1 of the contract.
    #
    #  `already_correct` when nothing changed is not a technicality: re-running
    #  a request that was already applied is a normal, successful outcome, and
    #  the user should be told "nothing needed doing" rather than "success"
    #  with no explanation of why nothing appears different.
    # ---------------------------------------------------------------------- #
    # Built with set_fact rather than as one large inline expression.
    #
    # The inline version - a multi-line {{ { ... } | to_json }} inside a block
    # scalar - was emitted as literal template source instead of being
    # evaluated, so the portal received Jinja rather than JSON. A YAML mapping
    # here is templated key by key, which is both more reliable and far easier
    # to read when one value is wrong.
    - name: Build the structured result
      ansible.builtin.set_fact:
        _result:
          host: "{{ inventory_hostname }}"
          playbook: update_ufw
          ticket_id: "{{ ticket_id }}"
          phase: execute
          status: "{{ 'success' if ufw_result.changed else 'already_correct' }}"
          changed: "{{ ufw_result.changed }}"
          summary: >-
            {% if ufw_result.changed %}
            {{ _rules_added }} firewall rule{{ '' if _rules_added | int == 1 else 's' }}
            added, allowing {{ subnet_list | join(', ') }}
            on port{{ '' if port_list | length == 1 else 's' }}
            {{ port_list | join(', ') }}/{{ protocol }}
            {% else %}
            No change needed - the requested rules were already in place.
            {% endif %}
          # One rule per source address now, each covering every port - not one
          # per subnet-and-port pair as before.
          rules_requested: "{{ subnet_list | length }}"
          rules_added: "{{ _rules_added }}"
          ports_per_rule: "{{ port_list | length }}"
          backup_path: "{{ _ufw_backup_file }}"
          rollback_available: true
          rollback_command: "ufw status numbered   # then: ufw delete <number>, comparing against {{ _ufw_backup_file }}"
          details:
            subnets: "{{ subnet_list }}"
            ports: "{{ port_list }}"
            protocol: "{{ protocol }}"
            target_group: "{{ target_group }}"
            comment: "{{ comment }}"
            rules_after: "{{ ufw_after.stdout_lines }}"
      vars:
        # `changed` on the whole task is true if ANY rule was new; this counts
        # how many of the per-subnet results actually changed something.
        _rules_added: "{{ ufw_result.results | default([]) | selectattr('changed') | list | length }}"

    - name: Emit structured result for the portal
      ansible.builtin.debug:
        msg: |
          OPSPORTAL_RESULT_BEGIN
          {{ _result | to_json }}
          OPSPORTAL_RESULT_END
