---
- name: Check firewall status on nayatv servers
  hosts: nayatvserver
  gather_facts: true
  become: true

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Detect which firewall is present
      ansible.builtin.set_fact:
        fw_name: >-
          {{
            'firewalld' if 'firewalld.service' in services
            else 'ufw' if 'ufw.service' in services
            else 'iptables' if 'iptables.service' in services
            else 'none'
          }}

    - name: Get firewalld runtime state
      ansible.builtin.command: firewall-cmd --state
      register: firewalld_state
      changed_when: false
      failed_when: false
      when: fw_name == 'firewalld'

    - name: Get firewalld active zones and rules
      ansible.builtin.command: firewall-cmd --list-all
      register: firewalld_rules
      changed_when: false
      failed_when: false
      when: fw_name == 'firewalld'

    - name: Get ufw status
      ansible.builtin.command: ufw status verbose
      register: ufw_state
      changed_when: false
      failed_when: false
      when: fw_name == 'ufw'

    - name: Get iptables rules
      ansible.builtin.command: iptables -L -n -v
      register: iptables_state
      changed_when: false
      failed_when: false
      when: fw_name == 'iptables'

    - name: Report firewall status
      ansible.builtin.debug:
        msg: |
          Host: {{ inventory_hostname }} ({{ ansible_host }})
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Firewall: {{ fw_name }}
          Service state: {{ services[fw_name + '.service'].state | default('n/a') }}
          Service startup: {{ services[fw_name + '.service'].status | default('n/a') }}
          ---
          {% if fw_name == 'firewalld' %}
          firewall-cmd --state: {{ firewalld_state.stdout | default('not running') }}
          {{ firewalld_rules.stdout | default('') }}
          {% elif fw_name == 'ufw' %}
          {{ ufw_state.stdout | default('') }}
          {% elif fw_name == 'iptables' %}
          {{ iptables_state.stdout | default('') }}
          {% else %}
          No known firewall service detected.
          {% endif %}
